<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scooby Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard.css') }}">
</head>
<body>
    <div class="dashboard-wrapper">
        <header class="dashboard-header">
            <h1 class="logo">Scooby</h1>
            <p class="tagline">Meeting Intelligence Platform</p>
        </header>

        <main class="dashboard-container">
            <aside class="control-panel">
                <div class="panel-header">
                    <h2>Meeting Setup</h2>
                </div>

                <form class="control-form">
                    <div class="form-group">
                        <label for="orgName" class="form-label">Organization Name</label>
                        <input 
                            id="orgName" 
                            class="form-input" 
                            type="text" 
                            placeholder="Enter organization name"
                            autocomplete="organization"
                        />
                    </div>

                    <div class="form-group">
                        <label for="meetingUrl" class="form-label">Meeting Link</label>
                        <input 
                            id="meetingUrl" 
                            class="form-input" 
                            type="url" 
                            placeholder="https://meet.google.com/..."
                            autocomplete="url"
                        />
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input id="saveTranscript" type="checkbox" checked />
                            <span class="checkbox-text">Enable transcript & summary generation</span>
                        </label>
                    </div>

                    <div class="button-group">
                        <button id="addScoobyBtn" class="btn btn-primary" type="button">
                            <span class="btn-icon">+</span>
                            <span>Add Scooby</span>
                        </button>
                        <button id="removeScoobyBtn" class="btn btn-danger" type="button">
                            <span class="btn-icon">×</span>
                            <span>Remove Scooby</span>
                        </button>
                    </div>

                    <div id="addScoobyStatus" class="status-message"></div>
                </form>
            </aside>

            <section class="summary-panel">
                <div class="panel-header">
                    <h2>Live Meeting Summary</h2>
                    <span id="summaryStatus" class="status-badge">Waiting for summary...</span>
                </div>

                <div id="summaryContent" class="summary-content">
                    <div class="summary-placeholder">
                        <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <p>No summary yet</p>
                        <p class="placeholder-subtext">Once Scooby joins the meeting, summaries will appear here automatically</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', path='js/dashboard.js') }}"></script>
</body>
</html>
